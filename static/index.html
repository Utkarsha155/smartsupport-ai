<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Chronos Collective · Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f10;
      --panel: #17171a;
      --panel-2: #1f1f23;
      --line: #2c2c31;
      --text: #ece8df;
      --muted: #9a958a;
      --gold: #c9a45c;
      --gold-soft: rgba(201, 164, 92, 0.12);
      --user: #c9a45c;
      --user-text: #17140d;
      --danger: #d77a6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1d1a14 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .app {
      width: 100%;
      max-width: 760px;
      height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    /* Header */
    header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 44px; height: 44px; flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      display: grid; place-items: center;
      position: relative;
    }
    .logo::before, .logo::after {
      content: ""; position: absolute; left: 50%; bottom: 50%;
      background: var(--gold); transform-origin: bottom center; border-radius: 2px;
    }
    .logo::before { width: 2px; height: 14px; transform: translateX(-50%) rotate(0deg); }
    .logo::after  { width: 2px; height: 10px; transform: translateX(-50%) rotate(120deg); }
    .brand h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
    .status-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #6fbf73; margin-right: 6px; vertical-align: middle;
    }
    .user-box { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .user-box label { font-size: 12px; color: var(--muted); }
    .user-box input {
      width: 120px; padding: 7px 10px; font: inherit; font-size: 13px;
      color: var(--text); background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 8px; outline: none;
    }
    .user-box input:focus { border-color: var(--gold); }
    .icon-btn {
      background: none; border: 1px solid var(--line); color: var(--muted);
      border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12px; cursor: pointer;
    }
    .icon-btn:hover { color: var(--danger); border-color: var(--danger); }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { max-width: 82%; display: flex; flex-direction: column; gap: 6px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .bubble {
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.55;
      word-wrap: break-word;
    }
    .msg.bot .bubble { background: var(--panel-2); border: 1px solid var(--line); border-top-left-radius: 4px; }
    .msg.user .bubble { background: var(--user); color: var(--user-text); border-top-right-radius: 4px; }
    .msg.bot.refused .bubble { border-color: rgba(215, 122, 106, 0.45); }
    .bubble p { margin: 0 0 6px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul { margin: 4px 0; padding-left: 18px; }
    .sources { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font-size: 11px; color: var(--gold); background: var(--gold-soft);
      border: 1px solid rgba(201, 164, 92, 0.3); border-radius: 999px; padding: 2px 9px;
    }
    .chip.warn { color: var(--danger); background: rgba(215, 122, 106, 0.1); border-color: rgba(215, 122, 106, 0.3); }

    .typing { display: flex; gap: 4px; padding: 14px 16px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* Welcome + suggestions */
    .welcome { text-align: center; margin: auto 0; padding: 10px; }
    .welcome h2 {
      font-family: "Cormorant Garamond", serif; font-weight: 500;
      font-size: 30px; margin: 0 0 6px; color: var(--text);
    }
    .welcome p { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .suggestions button {
      font: inherit; font-size: 13px; color: var(--text);
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: 0.15s;
    }
    .suggestions button:hover { border-color: var(--gold); color: var(--gold); }

    /* Input */
    form {
      display: flex; gap: 10px; padding: 16px 18px;
      border-top: 1px solid var(--line); background: var(--panel);
    }
    #input {
      flex: 1; padding: 13px 16px; font: inherit; font-size: 14.5px;
      color: var(--text); background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 12px; outline: none;
    }
    #input:focus { border-color: var(--gold); }
    #send {
      padding: 0 22px; font: inherit; font-weight: 600; font-size: 14px;
      color: var(--user-text); background: var(--gold);
      border: none; border-radius: 12px; cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: default; }
    footer { text-align: center; font-size: 11px; color: var(--muted); padding: 0 0 10px; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { height: 100vh; border-radius: 0; border: none; }
      .brand p { display: none; }
      .user-box label { display: none; }
      .user-box input { width: 90px; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo" aria-hidden="true"></div>
      <div class="brand">
        <h1>The Chronos Collective</h1>
        <p><span class="status-dot"></span>Chrono · AI Support Assistant</p>
      </div>
      <div class="user-box">
        <label for="userId">User ID</label>
        <input id="userId" maxlength="64" />
        <button class="icon-btn" id="clearBtn" title="Clear this user's chat memory">Clear</button>
      </div>
    </header>

    <div id="messages"></div>

    <form id="chatForm">
      <input id="input" placeholder="Ask about orders, shipping, returns, warranty..." autocomplete="off" maxlength="1000" />
      <button id="send" type="submit">Send</button>
    </form>
    <footer>Powered by RAG · FAISS · MongoDB memory · Gemini</footer>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const userIdEl = document.getElementById("userId");

    const SUGGESTIONS = [
      "What is your return policy?",
      "How long does delivery take?",
      "What warranty do Omega watches have?",
      "Do you offer no-cost EMI?",
      "Can I swim with a 50m water resistant watch?",
    ];

    // Remember the user ID in this browser
    let savedId = null;
    try { savedId = localStorage.getItem("tcc_user_id"); } catch (e) {}
    userIdEl.value = savedId || "guest_" + Math.random().toString(36).slice(2, 7);

    function currentUserId() { return userIdEl.value.trim() || "guest"; }

    // Escape HTML, then support **bold** and "- " / "* " bullet lists
    function renderText(text) {
      const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const lines = esc.split("\n");
      let html = "", inList = false;
      for (let line of lines) {
        line = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        const bullet = line.match(/^\s*[-*•]\s+(.*)/);
        if (bullet) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${bullet[1]}</li>`;
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line.trim()) html += `<p>${line}</p>`;
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    function prettySource(file) {
      return file.replace(".md", "").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    function addMessage(role, text, sources = [], inScope = true) {
      const welcome = document.querySelector(".welcome");
      if (welcome) welcome.remove();

      const msg = document.createElement("div");
      msg.className = `msg ${role}` + (inScope ? "" : " refused");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = renderText(text);
      msg.appendChild(bubble);

      if (role === "bot" && (sources.length || !inScope)) {
        const src = document.createElement("div");
        src.className = "sources";
        if (!inScope) src.innerHTML = `<span class="chip warn">Out of scope · guardrail</span>`;
        sources.forEach(s => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = "📄 " + prettySource(s);
          src.appendChild(chip);
        });
        msg.appendChild(src);
      }
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showWelcome() {
      messagesEl.innerHTML = `
        <div class="welcome">
          <h2>How may we help you today?</h2>
          <p>Ask Chrono anything about orders, delivery, returns, warranty or watch care.</p>
          <div class="suggestions"></div>
        </div>`;
      const box = messagesEl.querySelector(".suggestions");
      SUGGESTIONS.forEach(q => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = q;
        b.onclick = () => sendMessage(q);
        box.appendChild(b);
      });
    }

    function showTyping() {
      const t = document.createElement("div");
      t.className = "msg bot";
      t.id = "typing";
      t.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
      messagesEl.appendChild(t);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function hideTyping() { document.getElementById("typing")?.remove(); }

    async function sendMessage(text) {
      text = text.trim();
      if (!text) return;
      addMessage("user", text);
      input.value = "";
      sendBtn.disabled = true;
      showTyping();
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: currentUserId(), message: text }),
        });
        const data = await res.json();
        hideTyping();
        if (!res.ok) {
          addMessage("bot", data.detail?.toString() || "Something went wrong. Please try again.", [], false);
        } else {
          addMessage("bot", data.answer, data.sources, data.in_scope);
        }
      } catch (e) {
        hideTyping();
        addMessage("bot", "Could not reach the server. Is it running?", [], false);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    // Load this user's saved conversation from MongoDB
    async function loadHistory() {
      try {
        const res = await fetch(`/history/${encodeURIComponent(currentUserId())}`);
        const data = await res.json();
        if (!data.messages || !data.messages.length) return showWelcome();
        messagesEl.innerHTML = "";
        data.messages.forEach(m => addMessage(m.role === "user" ? "user" : "bot", m.content));
      } catch (e) {
        showWelcome();
      }
    }

    form.addEventListener("submit", e => { e.preventDefault(); sendMessage(input.value); });

    userIdEl.addEventListener("change", () => {
      try { localStorage.setItem("tcc_user_id", currentUserId()); } catch (e) {}
      loadHistory();
    });

    document.getElementById("clearBtn").addEventListener("click", async () => {
      if (!confirm(`Clear chat memory for "${currentUserId()}"?`)) return;
      await fetch(`/history/${encodeURIComponent(currentUserId())}`, { method: "DELETE" });
      showWelcome();
    });

    try { localStorage.setItem("tcc_user_id", currentUserId()); } catch (e) {}
    loadHistory();
  </script>
</body>
</html>
